<h1>Créer un compte</h1>
<p class="sous">Remplis ces informations pour ouvrir ton espace chef et sous-chef.</p>
<label>Nom et prénoms</label><div id="nom"></div>
<label>Téléphone</label><input id="tel" type="tel" inputmode="numeric" placeholder="07 00 00 00 00">
<label>Mot de passe (8 caractères minimum)</label><div class="mdp"><input id="mdp" type="password" autocomplete="new-password"><button type="button" data-voir="mdp">Afficher</button></div>
<label>Confirmer le mot de passe</label><div class="mdp"><input id="mdp2" type="password" autocomplete="new-password"><button type="button" data-voir="mdp2">Afficher</button></div>
<p class="msg" id="msg"></p>
<button class="btn" id="valider">Créer mon compte</button>
<p class="bas">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
</main>
<script type="module">
